  document.getElementById('ekran').innerHTML=h;
  odswiezMape(); window.scrollTo(0,0);
  if(!brak.length&&!stan.wyslano){ stan.wyslano=true; zapamietaj();
    try{ fetch(RESULTS_URL,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:RESULTS_TOKEN,subject:KARTA.przedmiot,title:KARTA.tytul,score:z,total:m})}); }catch(e){} }
}
function powtorzBledne(){ var pierwsze=-1;
  Q.forEach(function(q,i){ var o=ocenPytanie(i); if(stan.spr[i]&&o.z<o.m){ delete stan.a[i]; delete stan.spr[i]; delete stan.sam[i]; if(pierwsze<0) pierwsze=i; } });
  stan.wyslano=false; zapamietaj(); idz(pierwsze<0?0:pierwsze); }
function odNowa(){ if(!confirm('Wyczyścić wszystkie odpowiedzi i zacząć od nowa?')) return;
  stan={a:{},spr:{},sam:{}}; zapamietaj(); idz(0); }

document.getElementById('tag').textContent=KARTA.przedmiot;
document.getElementById('tytul').textContent=KARTA.tytul;
idz(0);
</script>
